    <!-- Google Consent Mode v2 — default to denied until the visitor makes a
         choice in the cookie banner (src/context/CookieConsentContext.tsx).
         Must run before the gtag.js loader below. -->
    <script>
      // Match React Router's case-insensitive, decoded private route before
      // loading any measurement script or capturing the management URL.
      function vveIsPrivatePage(pathname) {
        try { return /^\/manage-booking(?:\/|$)/i.test(decodeURIComponent(pathname)); }
        catch (e) { return true; }
      }
      function vveCanUseGoogleTags() {
        return ['vveclean.co.uk', 'www.vveclean.co.uk'].indexOf(location.hostname) !== -1 && !vveIsPrivatePage(location.pathname);
      }
      if (vveIsPrivatePage(location.pathname)) {
        document.querySelector('meta[name="robots"]').content = 'noindex, nofollow';
        var privateReferrer = document.createElement('meta');
        privateReferrer.name = 'referrer'; privateReferrer.content = 'no-referrer';
        document.head.appendChild(privateReferrer);
      }
      window.dataLayer = window.dataLayer || [];
      function gtag(){if (vveCanUseGoogleTags()) dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
      // Preserve campaign parameters through consent-safe navigation without
      // granting storage or weakening the denied-by-default consent state.
      gtag('set', 'url_passthrough', true);
      // A returning visitor's earlier choice (src/lib/consent.ts, key "vve_consent")
      // is applied immediately so they are not reset to denied on every visit.
      try {
        var storedConsent = JSON.parse(localStorage.getItem('vve_consent') || 'null');
        if (storedConsent && storedConsent.version === '2026-07-14' && typeof storedConsent.analytics === 'boolean' && typeof storedConsent.advertising === 'boolean') {
          var adState = storedConsent.advertising ? 'granted' : 'denied';
          gtag('consent', 'update', {
            ad_storage: adState,
            ad_user_data: adState,
            ad_personalization: adState,
            analytics_storage: storedConsent.analytics ? 'granted' : 'denied',
          });
        }
      } catch (e) { /* localStorage unavailable — stay at default denied */ }
    </script>

    <!-- Google tag (gtag.js) — AW-18214693277 -->
    <script>

        document.head.appendChild(googleTag);
        gtag('js', new Date());
        gtag('config', 'AW-18214693277');
      }
    </script>
